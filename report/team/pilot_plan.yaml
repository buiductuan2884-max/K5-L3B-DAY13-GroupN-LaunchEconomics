# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70, 0,75) = 1.251 yêu cầu mỗi nhóm.
#   b) Theo nhân viên, m = 75: DE = 1 + (75 - 1) * 0,02 = 2,48; n = 1.251 * 2,48 = 3.103 yêu cầu mỗi nhóm -> cần 42 nhân viên mỗi nhóm (tổng 84 > 40 hiện có: không đủ người).
#   c) 20 nhân viên mỗi nhóm: giới hạn c / ICC = 20 / 0,02 = 1.000 < 1.251 -> không đạt mức chênh 5 điểm dù m lớn đến đâu.
#   d) 6 depot mỗi nhóm: giới hạn c / ICC = 6 / 0,02 = 300 < 1.251 -> không đạt (và chỉ có 6 cụm < 20 cụm tối thiểu).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu mỗi người (DE = 1 + 298 * 0,02 = 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc cùng tuần, cùng 12 depot với 20 nhân viên nhóm can thiệp.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ câu trả lời trong cùng depot; giảm bằng cấp quyền truy cập theo tài khoản riêng và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, ngưỡng MDE 0,06, các luật dừng và ngày quyết định 2027-01-05 được chốt trước khi bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Do chỉ có 40 nhân viên (20 cụm mỗi nhóm), không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251), nên chấp nhận nâng MDE lên 6 điểm (n_per_arm = 859, m >= 299 yêu cầu/người). Nếu tác động thật chỉ là 5 điểm, power giảm còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn mẫu là 4,25% (51/1.200) và trong phạm vi noi_dia + hang_nang là 3,97% (39/982). Nếu đặt ngưỡng tuyệt đối 3% sẽ dừng ngay tuần đầu, nên chọn ngưỡng so với đối chứng (cao hơn >= 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) trên toàn bộ 12 depot; loại quoc_te (22.515 đ = 1,88x, simulated, thành công 27,3%) và doi_tac (10.215 đ = 0,85x, simulated, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên (mỗi bước 1 tuần); chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi từ 0.05 lên 0.06 do giới hạn 40 nhân viên (power ~0.64 nếu hiệu ứng thật là 0.05)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy song song cùng thời gian, cùng 12 depot"
    spillover_risk: "Rủi ro chia sẻ câu trả lời trong cùng depot; giảm bằng phân quyền tài khoản riêng và log theo staff_id"
    predeclared: "Chốt trước ngày bắt đầu: chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt trần 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng sang hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và rà soát 20 trace trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt hệ thống, hiệu lực trong 30 phút; toàn bộ yêu cầu được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Chi phí mỗi việc thành công A2 toàn mẫu: 4.472 đ [simulated]"
    - "Chi phí mỗi việc thành công noi_dia: 2.696 đ (0,22x) [simulated]"
    - "Chi phí mỗi việc thành công hang_nang: 8.221 đ (0,69x) [simulated]"
    - "Chi phí mỗi việc thành công quoc_te: 22.515 đ (1,88x) [simulated]"
    - "Chi phí mỗi việc thành công doi_tac: 10.215 đ (0,85x) [simulated]"
    - "Phút xem lại (890 phút = 1.780.000 đ) và phút làm lại (1.132 phút = 2.264.000 đ) [simulated]"
